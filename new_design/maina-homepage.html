const ExchangeIcon = ({ size = 22, color = '#B8651E', sw = 2.4 }) => {
  const c = size / 2, R = size * 0.33, r = size * 0.18;
  const al = size * 0.16;
  const arrowPts = (x, y, angle) => {
    const a1 = angle + 2.4, a2 = angle - 2.4;
    return `M${x+al*Math.cos(a1)},${y+al*Math.sin(a1)} L${x},${y} L${x+al*Math.cos(a2)},${y+al*Math.sin(a2)}`;
  };
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} fill="none">
      <path d={`M${c-R} ${c-r*0.5} A${R} ${R} 0 0 1 ${c+R} ${c-r*0.5}`} stroke={color} strokeWidth={sw} strokeLinecap="round"/>
      <path d={arrowPts(c+R, c-r*0.5, Math.PI*0.55)} stroke={color} strokeWidth={sw} fill="none" strokeLinecap="round" strokeLinejoin="round"/>
      <path d={`M${c+R} ${c+r*0.5} A${R} ${R} 0 0 1 ${c-R} ${c+r*0.5}`} stroke={color} strokeWidth={sw} strokeLinecap="round"/>
      <path d={arrowPts(c-R, c+r*0.5, Math.PI*-0.45)} stroke={color} strokeWidth={sw} fill="none" strokeLinecap="round" strokeLinejoin="round"/>
    </svg>
  );
};

          </div>
          {/* Input */}
          <input
            value={query}
            onChange={e => setQuery(e.target.value)}
            placeholder="Ko meklē?"
            style={{ flex: 1, border: 'none', outline: 'none', padding: '0 12px', fontSize: 13, color: '#0A0A0A', background: 'transparent' }}
          />
          <button style={{ padding: '0 16px', background: '#0A0A0A', border: 'none', cursor: 'pointer', display: 'flex', alignItems: 'center' }}>
            <Icon name="search" size={16} color="#FFFFFF"/>
          </button>
        </div>

        {/* Nav links */}
        <nav className="nav-links" style={{ display: 'flex', gap: 20, alignItems: 'center' }}>
          {['Transports', 'Nekustamais', 'Darbs'].map(l => (
            <span key={l} style={{ fontSize: 13, color: '#6B6B68', cursor: 'pointer', whiteSpace: 'nowrap', fontWeight: 500 }}
              onMouseEnter={e => e.target.style.color='#0A0A0A'} onMouseLeave={e => e.target.style.color='#6B6B68'}>{l}</span>
          ))}
        </nav>

        {/* Actions */}
        <div className="nav-actions" style={{ display: 'flex', gap: 10, alignItems: 'center', marginLeft: 'auto', flexShrink: 0 }}>
          <button style={{ background: 'none', border: 'none', cursor: 'pointer', padding: 6, display: 'flex' }}>
            <Icon name="bell" size={20} color="#6B6B68"/>
          </button>
          <button style={{ background: 'none', border: '1px solid #E8E6DF', borderRadius: 7, padding: '0 12px', height: 36, fontSize: 13, color: '#0A0A0A', cursor: 'pointer', fontWeight: 500, display: 'flex', alignItems: 'center', gap: 6 }}>
            <Icon name="user" size={16} color="#0A0A0A"/>
            <span>Ieiet</span>
          </button>
          <button style={{ background: '#B8651E', border: 'none', borderRadius: 7, padding: '0 16px', height: 36, fontSize: 13, color: '#FFFFFF', cursor: 'pointer', fontWeight: 700, display: 'flex', alignItems: 'center', gap: 6, whiteSpace: 'nowrap' }}>
            <Icon name="plus" size={14} color="#FFFFFF"/>
            Ievietot
          </button>
        </div>
      </div>
    </header>
  );
};

// ── Category strip ────────────────────────────────────────────────

const CategorySection = ({ onSelect }) => (
  <div style={{ background: '#FFFFFF', borderBottom: '1px solid #E8E6DF', padding: '28px 0 24px' }}>
    <div style={{ maxWidth: 1200, margin: '0 auto', padding: '0 20px' }}>
      <h2 style={{ fontSize: 16, fontWeight: 700, color: '#0A0A0A', marginBottom: 18, letterSpacing: '-0.3px' }}>
        Pārlūko kategorijas
      </h2>
      <div className="cat-grid">
        {CATEGORIES.map(cat => <CatTile key={cat.id} cat={cat} onClick={onSelect}/>)}
      </div>
    </div>
  </div>
);

// ── Chips ─────────────────────────────────────────────────────────

const ChipsSection = ({ setQuery }) => {
  const [active, setActive] = React.useState(null);
  return (
    <div style={{ background: '#FAFAF7', borderBottom: '1px solid #E8E6DF', padding: '12px 0' }}>
      <div style={{ maxWidth: 1200, margin: '0 auto', padding: '0 20px' }}>
        <div style={{ display: 'flex', gap: 8, overflowX: 'auto', paddingBottom: 2 }} className="hscroll">
          {CHIPS.map(chip => (
            <button key={chip} onClick={() => { setActive(chip); setQuery(chip); }} style={{
              flexShrink: 0,
              padding: '7px 14px',
              background: active === chip ? '#0A0A0A' : '#FFFFFF',
              border: `1.5px solid ${active === chip ? '#0A0A0A' : '#E8E6DF'}`,
              borderRadius: 20,
              fontSize: 12, fontWeight: 500,
              color: active === chip ? '#FFFFFF' : '#0A0A0A',
              cursor: 'pointer', transition: 'all 0.14s',
            }}>{chip}</button>
          ))}
        </div>
      </div>
    </div>
  );
};

// ── Featured ──────────────────────────────────────────────────────

const FeaturedSection = () => (
  <section style={{ padding: '36px 0 0' }}>
    <div style={{ maxWidth: 1200, margin: '0 auto', padding: '0 20px' }}>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 16 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
          <div style={{ width: 4, height: 20, background: '#B8651E', borderRadius: 2 }}/>
          <h2 style={{ fontSize: 16, fontWeight: 700, color: '#0A0A0A', letterSpacing: '-0.3px' }}>TOP sludinājumi</h2>
          <div style={{ padding: '2px 8px', background: '#FEF3E7', border: '1px solid rgba(184,101,30,0.3)', borderRadius: 10, fontSize: 10, fontWeight: 700, color: '#B8651E' }}>TOP</div>
        </div>
        <button style={{ display: 'flex', alignItems: 'center', gap: 4, fontSize: 13, color: '#B8651E', fontWeight: 600, background: 'none', border: 'none', cursor: 'pointer' }}>
          Skatīt visus <Icon name="arrowR" size={14} color="#B8651E"/>
        </button>
      </div>
      <div className="hscroll" style={{ paddingBottom: 8 }}>
        {[...ADS, ...ADS].filter(a => a.top).map((ad, i) => (
          <ListingCard key={`${ad.id}-${i}`} ad={ad} wide/>
        ))}
      </div>
    </div>
  </section>
);

// ── Latest ads ────────────────────────────────────────────────────

const LatestSection = ({ activeCat }) => {
  const [showAll, setShowAll] = React.useState(false);
  const filtered = activeCat ? ADS.filter(a => a.cat.toLowerCase().includes(activeCat.toLowerCase())) : ADS;
  const displayed = showAll ? filtered : filtered.slice(0, 8);

  return (
    <section style={{ padding: '36px 0' }}>
      <div style={{ maxWidth: 1200, margin: '0 auto', padding: '0 20px' }}>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 20 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
            <div style={{ width: 4, height: 20, background: '#0A0A0A', borderRadius: 2 }}/>
            <h2 style={{ fontSize: 16, fontWeight: 700, color: '#0A0A0A', letterSpacing: '-0.3px' }}>
              {activeCat ? `${activeCat}` : 'Jaunākie sludinājumi'}
            </h2>
            <span style={{ fontSize: 12, color: '#6B6B68', fontWeight: 400 }}>{filtered.length} sludinājumi</span>
          </div>
          <div style={{ display: 'flex', gap: 8 }}>
            {['Visi', 'Šodien', 'Vakar'].map((f, i) => (
              <button key={f} style={{
                padding: '5px 12px', borderRadius: 6,
                background: i === 0 ? '#0A0A0A' : 'none',
                border: `1px solid ${i === 0 ? '#0A0A0A' : '#E8E6DF'}`,
                fontSize: 12, fontWeight: i === 0 ? 600 : 400,
                color: i === 0 ? '#FFFFFF' : '#6B6B68', cursor: 'pointer',
              }}>{f}</button>
            ))}
          </div>
        </div>

        <div className="ads-grid">
          {displayed.map(ad => <ListingCard key={ad.id} ad={ad}/>)}
        </div>

        {!showAll && filtered.length > 8 && (
          <div style={{ textAlign: 'center', marginTop: 32 }}>
            <button onClick={() => setShowAll(true)} style={{
              background: 'none', border: '1.5px solid #0A0A0A',
              borderRadius: 8, padding: '12px 32px',
              fontSize: 14, fontWeight: 600, color: '#0A0A0A', cursor: 'pointer',
              display: 'inline-flex', alignItems: 'center', gap: 8, transition: 'all 0.14s',
            }}>
              Rādīt vairāk sludinājumus <Icon name="arrowR" size={16} color="#0A0A0A"/>
            </button>
          </div>
        )}
      </div>
    </section>
  );
};

// ── Popular searches ──────────────────────────────────────────────

const PopularSection = ({ setQuery }) => (
  <section style={{ background: '#FFFFFF', borderTop: '1px solid #E8E6DF', padding: '32px 0' }}>
    <div style={{ maxWidth: 1200, margin: '0 auto', padding: '0 20px' }}>
      <h3 style={{ fontSize: 13, fontWeight: 700, color: '#6B6B68', letterSpacing: '0.06em', textTransform: 'uppercase', marginBottom: 16 }}>
        Populāri meklējumi
      </h3>
      <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8 }}>
        {POPULAR.map(p => (
          <button key={p} onClick={() => setQuery(p)} style={{
            padding: '6px 14px', background: '#F3F2EE', border: '1px solid #E8E6DF',
            borderRadius: 20, fontSize: 12, color: '#0A0A0A', cursor: 'pointer',
            fontWeight: 400, transition: 'all 0.12s',
          }}
          onMouseEnter={e => { e.currentTarget.style.background='#FEF3E7'; e.currentTarget.style.color='#B8651E'; e.currentTarget.style.borderColor='rgba(184,101,30,0.3)'; }}
          onMouseLeave={e => { e.currentTarget.style.background='#F3F2EE'; e.currentTarget.style.color='#0A0A0A'; e.currentTarget.style.borderColor='#E8E6DF'; }}>
            {p}
          </button>
        ))}
      </div>
    </div>
  </section>
);

// ── App banner ────────────────────────────────────────────────────

  <section style={{ background: '#0A0A0A', padding: '40px 0' }}>
    <div style={{ maxWidth: 1200, margin: '0 auto', padding: '0 20px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexWrap: 'wrap', gap: 24 }}>
      <div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 10 }}>

          <span style={{ fontWeight: 800, fontSize: 22, letterSpacing: '-0.8px', color: '#FFFFFF' }}>

// ── Footer ────────────────────────────────────────────────────────

const Footer = () => {
  const cols = [
    { title: 'maiņa.lv', links: ['Par mums', 'Kā pārdot?', 'Kā pirkt?', 'Drošība', 'Karjera'] },

// ── Mobile bottom nav ─────────────────────────────────────────────

const MobileNav = () => {
  const [tab, setTab] = React.useState('home');
  const tabs = [
    { id:'home', label:'Sākums', icon:'grid' },
    { id:'search', label:'Meklēt', icon:'search' },
    { id:'post', label:'Ievietot', icon:'plus', cta: true },
    { id:'messages', label:'Ziņas', icon:'chat' },
    { id:'profile', label:'Profils', icon:'user' },
  ];
  return (
    <div style={{
      display: 'none', position: 'fixed', bottom: 0, left: 0, right: 0,
      background: '#FFFFFF', borderTop: '1px solid #E8E6DF',
      padding: '8px 0 env(safe-area-inset-bottom, 12px)',
      justifyContent: 'space-around', alignItems: 'center', zIndex: 200,
    }}
    id="mobile-nav">
      {tabs.map(t => t.cta ? (
        <button key={t.id} onClick={() => setTab(t.id)} style={{
          width: 48, height: 48, borderRadius: '50%', background: '#B8651E',
          border: 'none', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center',
          marginTop: -20, boxShadow: '0 4px 16px rgba(184,101,30,0.4)',
        }}>
          <Icon name={t.icon} size={20} color="#FFFFFF"/>
        </button>
      ) : (
        <button key={t.id} onClick={() => setTab(t.id)} style={{
          display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 3,
          background: 'none', border: 'none', cursor: 'pointer', padding: '0 8px',
        }}>
          <Icon name={t.icon} size={22} color={tab === t.id ? '#B8651E' : '#6B6B68'}/>
          <span style={{ fontSize: 9.5, fontWeight: tab === t.id ? 600 : 400, color: tab === t.id ? '#B8651E' : '#6B6B68' }}>{t.label}</span>
        </button>
      ))}
    </div>
  );
};

// ── App ───────────────────────────────────────────────────────────

const App = () => {
  const [city, setCity]     = React.useState('Visa Latvija');
  const [query, setQuery]   = React.useState('');
  const [activeCat, setActiveCat] = React.useState(null);

  const handleCatSelect = (cat) => {
    setActiveCat(prev => prev?.id === cat.id ? null : cat.lv);
    document.getElementById('latest')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
  };

  return (
    <div style={{ minHeight: '100vh', background: '#FAFAF7' }}>
      <Navbar city={city} setCity={setCity} query={query} setQuery={setQuery}/>
      <CategorySection onSelect={handleCatSelect}/>
      <ChipsSection setQuery={setQuery}/>
      <FeaturedSection/>
      <div id="latest">
        <LatestSection activeCat={activeCat}/>
      </div>
      <PopularSection setQuery={setQuery}/>
      <AppBanner/>
      <Footer/>
      <MobileNav/>

      {/* Inject mobile nav CSS */}
      <style>{`
        @media (max-width: 768px) {
          #mobile-nav { display: flex !important; }
          body { padding-bottom: 68px; }
          .cat-grid { grid-template-columns: repeat(3, 1fr) !important; }
          .ads-grid { grid-template-columns: repeat(2, 1fr) !important; }
          footer > div > div:first-child { grid-template-columns: repeat(2, 1fr) !important; }
        }
      `}</style>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
